<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逐句阅读器</title>
<style>
  :root { --bg:#14161b; --fg:#f2f2f2; --dim:#6b7080; --accent:#e0533d; --bar:#2a2d36; --line:#3a3e4a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }
  body { display:flex; flex-direction:column; user-select:none; -webkit-tap-highlight-color:transparent; } /* 手机上点屏幕不再整片闪蓝 */
  header { display:flex; gap:10px; align-items:center; padding:12px 16px; color:var(--dim); font-size:14px; flex-wrap:wrap; }
  header input[type=number] { width:80px; }
  header input, header select, header button { background:var(--bar); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:14px; }
  header select { max-width:260px; }
  header button { cursor:pointer; }
  #title { color:var(--fg); max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #progress { height:6px; background:var(--bar); cursor:pointer; }
  #fill { height:100%; width:0; background:var(--accent); }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:16px; gap:28px; text-align:center; cursor:pointer; overflow:hidden; }
  .side { color:var(--dim); font-size:clamp(15px, 2vw, 22px); line-height:1.5; min-height:1.5em; max-width:900px; white-space:pre-wrap;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  #cur { font-size:clamp(24px, 3.8vw, 46px); line-height:1.5; max-width:1000px; white-space:pre-wrap; font-weight:600; }
  #cur.long { text-align:left; font-size:clamp(20px, 2.8vw, 34px); }
  #cur.h { color:var(--accent); }
  #cur.img img { display:block; max-width:100%; max-height:62vh; margin:0 auto; }
  img.gl { display:inline; height:1em; width:auto; vertical-align:-0.12em; }
  #cur.img .cap { margin-top:10px; color:var(--dim); font-size:15px; font-weight:400; text-align:center; }
  #cur.code { font-family: Menlo, "SF Mono", monospace; font-weight:400; font-size:clamp(13px, 1.5vw, 18px); text-align:left;
    background:var(--bar); padding:16px 20px; border-radius:8px; max-height:60vh; overflow:auto; }
  #chap { color:var(--dim); font-size:14px; letter-spacing:.05em; min-height:1.2em; }
  footer { padding:10px 16px 16px; color:var(--dim); font-size:13px; text-align:center; }
  kbd { background:var(--bar); border-radius:4px; padding:1px 6px; color:var(--fg); }
  #drop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(20,22,27,.92);
    border:3px dashed var(--accent); font-size:28px; z-index:9; pointer-events:none; }
  body.dragging #drop { display:flex; }
  #welcome { color:var(--dim); font-size:20px; line-height:2; cursor:default; }
  #welcome b { color:var(--fg); }
  #tip { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.75); z-index:10; cursor:pointer; }
  #tip div { background:#fff; color:#333; border-radius:12px; padding:16px 16px 12px; text-align:center; font-size:14px; cursor:default; }
  #tip img { display:block; width:min(420px, 80vw, 68vh); height:auto; }
  /* 搜索 */
  #qNav { display:none; align-items:center; gap:4px; color:var(--dim); font-size:14px; }
  body.searching #qNav { display:flex; }
  #qNavLabel { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qb { display:flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; border:1px solid var(--line); border-radius:6px;
    background:var(--bar); color:var(--fg); cursor:pointer; }
  .qb svg { width:18px; height:18px; fill:currentColor; }
  mark { background:rgba(224,83,61,.4); color:inherit; border-radius:2px; padding:0 1px; }
  #qPanel { position:fixed; inset:0; z-index:11; display:flex; align-items:flex-start; justify-content:center; padding-top:8vh; background:rgba(0,0,0,.6); }
  #qBox { width:min(680px, 92vw); max-height:80vh; display:flex; flex-direction:column; background:var(--bg); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  #qHead { display:flex; align-items:center; gap:10px; padding:12px 16px; }
  #qHead > svg { width:20px; height:20px; fill:var(--dim); flex:none; }
  #qInput { flex:1; min-width:0; height:36px; padding:0 10px; font-size:15px; background:var(--bar); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  #qInput:focus { outline:none; border-color:var(--accent); }
  #qCancel, #qClearRecent { border:0; background:transparent; color:var(--accent); font-size:14px; cursor:pointer; }
  #qStatus { padding:0 16px 8px; color:var(--dim); font-size:13px; }
  #qStatus:empty { display:none; }
  #qList { overflow:auto; }
  .q-row { padding:10px 16px; border-top:1px solid var(--line); cursor:pointer; }
  .q-row:hover { background:var(--bar); }
  .q-meta { color:var(--dim); font-size:12px; }
  .q-text { font-size:15px; line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .q-recent-head { display:flex; justify-content:space-between; align-items:center; padding:4px 16px; color:var(--dim); font-size:13px; }
  .q-recent { display:block; width:100%; padding:10px 16px; border:0; border-top:1px solid var(--line); background:transparent; color:var(--fg); font-size:15px; text-align:left; cursor:pointer; }
  .hidden { display:none !important; }

  /* ========== 手机界面 ==========
     只在触屏设备上生效（安卓 App 和手机浏览器）；电脑上 .m-only 元素全部隐藏，上面的样式原样不变。
     依据设计稿：Claude Design「Reader Mobile Spec」交付稿 v1（2026-10-08），尺寸单位都是 dp（= CSS px）。 */
  @font-face { font-family:"Source Serif 4"; font-style:normal; font-weight:400 600; font-display:swap;
    src:url(fonts/SourceSerif4-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  .m-only { display:none; }
  @media (pointer: coarse) {
    :root { --r-bg:#f3f2f2; --r-surface:#eae9e9; --r-text:#201e1d; --r-text2:#605d5d; --r-hint:#7d7979; --r-track:#d7d3d3;
      --r-accent:#0088b0; --r-accent-press:#006786; --r-accent-text:#006786; --r-on-accent:#f3f2f2; --r-heading:#d6006c;
      --r-divider:rgba(32,30,29,.16); --r-press:rgba(32,30,29,.07); --r-scrim:rgba(45,43,43,.5);
      --r-font:"Source Serif 4", "Noto Serif CJK SC", "Songti SC", serif; }
    @media (prefers-color-scheme: dark) {
      :root { --r-bg:#201e1d; --r-surface:#2d2b2b; --r-text:#f3f2f2; --r-text2:#bab6b6; --r-hint:#7d7979; --r-track:#444141;
        --r-accent:#62c5ee; --r-accent-press:#99e0ff; --r-accent-text:#62c5ee; --r-on-accent:#201e1d; --r-heading:#ff90b1;
        --r-divider:rgba(243,242,242,.16); --r-press:rgba(243,242,242,.08); --r-scrim:rgba(0,0,0,.6); }
    }
    html, body { background:var(--r-bg); color:var(--r-text); font-family:var(--r-font); }
    header, footer, #progress, #welcome { display:none !important; }
    .m-only { display:flex; }
    .ic { display:block; flex:none; width:28px; height:28px; fill:currentColor; }
    /* 还没打开书：只显示手机欢迎页 */
    body:has(#welcome:not(.hidden)) :is(#stage, #mBar) { display:none; }
    body:not(:has(#welcome:not(.hidden))) #mEmpty { display:none; }

    /* 翻句区：顶部章节行 48，正文块在剩余空间居中、整体上移 40 */
    #stage { padding:0 30px 40px; gap:30px; align-items:stretch; justify-content:flex-start; text-align:left; }
    #chap { flex:none; height:48px; line-height:48px; margin-bottom:-30px; font-size:13px; letter-spacing:0; color:var(--r-text2);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #prev { margin-top:auto; }
    #next { margin-bottom:auto; }
    .side { max-width:none; min-height:24px; font-size:15px; line-height:1.6; color:var(--r-hint); -webkit-line-clamp:2; }
    #cur { max-width:none; font-size:24px; line-height:1.6; text-wrap:pretty; }
    #cur.long { font-size:20px; line-height:1.65; }
    #cur.h { font-size:32px; line-height:1.3; color:var(--r-heading); }
    #cur.code { font:400 13px/1.6 Menlo, "Roboto Mono", monospace; white-space:pre; background:var(--r-surface); padding:15px; border-radius:2px; max-height:60%; }
    #cur.img img { width:100%; max-height:50vh; object-fit:contain; }
    #cur.img .cap { color:var(--r-text2); font-size:13px; }

    /* 底部控件区 126 = 12 + 进度行 28 + 线 2 + 12 + 按钮 56 + 16；是 #stage 的兄弟，点这里不翻句 */
    #mBar { flex:none; flex-direction:column; height:126px; padding:12px 15px 16px; }
    #mStatus { height:28px; padding:0 15px; display:flex; align-items:center; justify-content:space-between; font-size:13px; }
    #mCount, #mCount2 { color:var(--r-text2); font-variant-numeric:tabular-nums; }
    #mAutoState { display:none; align-items:center; gap:5px; color:var(--r-accent-text); }
    #mAutoState .ic { width:16px; height:16px; }
    body.playing #mAutoState { display:flex; }
    #mTrack { position:relative; height:2px; margin:0 15px; background:var(--r-track); }
    #mFill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--r-accent); }
    #mBtns { display:flex; align-items:center; gap:12px; height:56px; margin-top:12px; }
    .mb { flex:none; display:flex; align-items:center; justify-content:center; width:56px; height:56px; padding:0; border:0; border-radius:2px;
      background:transparent; color:var(--r-text); cursor:pointer; }
    .mb:active { background:var(--r-press); }
    .mb.s48 { width:48px; height:48px; }
    .mb.s48 .ic { width:24px; height:24px; }
    #mPlay { background:var(--r-accent); color:var(--r-on-accent); }
    #mPlay:active { background:var(--r-accent-press); }
    #mPlay .i-pause, body.playing #mPlay .i-play { display:none; }
    body.playing #mPlay .i-pause { display:block; }

    /* 欢迎页：点任意处 = 打开文件 */
    #mEmpty { flex:1; flex-direction:column; cursor:pointer; }
    .m-brand { height:48px; padding:0 30px; display:flex; align-items:center; font-size:13px; letter-spacing:.04em; color:var(--r-text2); }
    .m-hero { flex:1; display:flex; flex-direction:column; justify-content:center; gap:15px; padding:0 30px 40px; }
    .m-h1 { font-size:28px; line-height:1.4; font-weight:600; letter-spacing:-.01em; text-wrap:pretty; }
    .m-sub { font-size:15px; line-height:1.65; color:var(--r-text2); text-wrap:pretty; }
    .m-actions { display:flex; flex-direction:column; gap:10px; padding:0 15px 20px; }
    .m-btn { display:flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0; border:1px solid var(--r-divider);
      border-radius:2px; background:transparent; color:var(--r-text); font:600 15px var(--r-font); cursor:pointer; }
    .m-btn:active { background:var(--r-press); }
    .m-btn .ic { width:20px; height:20px; }
    .m-btn.primary { height:56px; gap:10px; border:0; background:var(--r-accent); color:var(--r-on-accent); font-size:17px; }
    .m-btn.primary:active { background:var(--r-accent-press); }
    .m-btn.primary .ic { width:24px; height:24px; }
    .m-btn.quiet { border:0; color:var(--r-text2); font-weight:400; }

    /* 菜单：自底部滑入 200ms，收起 150ms */
    #mMenu { position:fixed; inset:0; z-index:8; }
    #mScrim { position:absolute; inset:0; background:var(--r-scrim); opacity:0; transition:opacity 150ms; }
    #mSheet { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; padding:15px 15px 16px;
      background:var(--r-surface); border-radius:4px 4px 0 0; box-shadow:0 12px 32px rgba(45,43,43,.22);
      transform:translateY(100%); transition:transform 150ms ease-in; }
    #mMenu.open #mScrim { opacity:1; transition-duration:200ms; }
    #mMenu.open #mSheet { transform:none; transition:transform 200ms ease-out; }
    .m-head { display:flex; align-items:flex-start; gap:10px; padding-left:15px; }
    .m-head > div { flex:1; min-width:0; padding-top:8px; }
    #mTitle { font-size:20px; line-height:1.35; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    #mCount2 { display:block; margin-top:5px; font-size:13px; }
    #mScrub { position:relative; height:48px; margin:5px 15px 0; cursor:pointer; }
    #mScrub i { position:absolute; left:0; top:22px; height:4px; border-radius:2px; }
    #mScrubTrack { right:0; background:var(--r-track); }
    #mScrubFill { width:0; background:var(--r-accent); }
    #mThumb { position:absolute; top:14px; left:0; width:20px; height:20px; margin-left:-10px; border-radius:50%;
      background:var(--r-accent); box-shadow:0 0 0 3px var(--r-surface); }
    .m-rows { display:flex; flex-direction:column; gap:10px; margin-top:5px; }
    .m-row { position:relative; display:flex; align-items:center; gap:15px; height:56px; padding-left:15px; font-size:15px; }
    .m-row > .ic { width:24px; height:24px; color:var(--r-text2); }
    .m-row > .grow { flex:1; }
    .m-sq { width:48px; height:48px; display:flex; align-items:center; justify-content:center; padding:0; border:1px solid var(--r-divider);
      border-radius:2px; background:transparent; color:var(--r-text); cursor:pointer; }
    .m-sq:active, #mJumpGo:active, #mTocRow:active { background:var(--r-press); }
    .m-sq .ic { width:20px; height:20px; }
    #mSpeedVal { width:92px; text-align:center; font-variant-numeric:tabular-nums; }
    #mSpeedVal small { font-size:12px; color:var(--r-text2); }
    #mJump { width:110px; height:48px; padding:0 10px; border:1px solid var(--r-divider); border-radius:2px; background:var(--r-bg);
      color:var(--r-text); font:400 15px var(--r-font); caret-color:var(--r-accent); }
    #mJumpGo { width:64px; height:48px; padding:0; border:0; border-radius:2px; background:transparent; color:var(--r-accent-text);
      font:600 15px var(--r-font); cursor:pointer; }
    #mTocRow { padding-right:15px; border-radius:2px; }
    #mChapName { flex:1; min-width:0; text-align:right; color:var(--r-text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .m-row > .chev { width:20px; height:20px; color:var(--r-text2); }
    #mSearchRow { padding-right:15px; border-radius:2px; cursor:pointer; }
    #mSearchRow:active { background:var(--r-press); }
    #mToc { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    body:has(#toc.hidden) #mTocRow { display:none; }
    .m-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }

    /* 搜索：导航条替换顶部章节行；搜索页占满整屏 */
    body.searching #chap { display:none; }
    #qNav { flex:none; height:48px; margin:0 -15px -30px 0; gap:0; color:var(--r-text2); font-size:13px; }
    #qNavLabel { flex:1; }
    .qb { width:48px; height:48px; border:0; border-radius:2px; background:transparent; color:var(--r-text); }
    .qb:active { background:var(--r-press); }
    .qb svg { width:22px; height:22px; }
    mark { background:color-mix(in srgb, var(--r-accent) 28%, transparent); }
    #qPanel { padding:0; background:var(--r-bg); }
    #qBox { width:100%; max-height:none; height:100%; border:0; border-radius:0; background:var(--r-bg); color:var(--r-text); }
    #qHead { gap:10px; padding:8px 15px; }
    #qHead > svg { width:24px; height:24px; fill:var(--r-text2); }
    #qInput { height:48px; padding:0 12px; font:400 16px var(--r-font); background:var(--r-surface); color:var(--r-text);
      border:1px solid var(--r-divider); border-radius:2px; caret-color:var(--r-accent); }
    #qInput:focus { border-color:var(--r-accent); }
    #qCancel { width:64px; height:48px; color:var(--r-accent-text); font:600 15px var(--r-font); }
    #qStatus { padding:4px 30px 8px; color:var(--r-text2); }
    .q-row { min-height:56px; padding:10px 30px; border-top:1px solid var(--r-divider); }
    .q-row:hover { background:transparent; }
    .q-row:active { background:var(--r-press); }
    .q-meta { color:var(--r-text2); font-size:13px; font-variant-numeric:tabular-nums; }
    .q-recent-head { padding:4px 30px; color:var(--r-text2); }
    #qClearRecent { height:48px; color:var(--r-accent-text); font:400 15px var(--r-font); }
    .q-recent { min-height:48px; padding:0 30px; border-top:1px solid var(--r-divider); color:var(--r-text); font:400 15px var(--r-font); }
    .q-recent:active { background:var(--r-press); }

    /* 赞赏码：卡片保持白底，保证二维码可扫 */
    #tip { padding:20px; }
    #tip div { border-radius:4px; padding:15px 15px 10px; color:#201e1d; font-size:14px; }
    #tip img { width:280px; }
    #tip p { margin:10px 0 0; }
    /* 安卓大多只自带思源宋体常规体，600 字重加不粗（Redmi K60 实测）：用描边模拟粗体，0.025em ≈ 24px 字 0.6px */
    .android :is(#cur:not(.code):not(.img), .m-h1, #mTitle, .m-btn:not(.quiet), #mJumpGo) { -webkit-text-stroke:0.025em currentColor; }
  }
</style>
</head>
<body>
<header>
  <button id="open" title="也可以直接把文件拖进窗口">打开文件</button>
  <span id="title"></span>
  <span id="count"></span>
  <span style="flex:1"></span>
  <select id="toc" title="跳到章节"></select>
  <label>跳到第 <input id="jump" type="number" min="1"> 句</label>
  <label>速度 <input id="speed" type="number" min="60" max="2000" step="20" value="300"> 字/分</label>
  <button id="auto" title="按 P 也可以">自动播放：关</button>
  <button id="qBtn" title="也可以按 / 键">🔍 搜索</button>
  <button id="tipBtn" title="觉得好用的话">☕ 赞赏</button>
  <input id="file" type="file" accept=".md,.markdown,.txt,.epub" class="hidden">
</header>
<div id="progress"><div id="fill"></div></div>
<main id="stage">
  <div id="qNav"><span id="qNavLabel"></span>
    <button id="qPrev" class="qb" aria-label="上一个结果"><svg class="ic"><use href="#i-caret-left"/></svg></button>
    <button id="qNext" class="qb" aria-label="下一个结果"><svg class="ic"><use href="#i-caret-right"/></svg></button>
    <button id="qClose" class="qb" aria-label="退出搜索"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div id="chap"></div>
  <div class="side" id="prev"></div>
  <div id="cur"></div>
  <div class="side" id="next"></div>
  <div id="welcome">把 <b>.md</b> / <b>.epub</b> / <b>.txt</b> 文件拖进这个窗口<br>或点左上角「打开文件」<br>（会记住上次读的书和读到哪一句）</div>
</main>
<!-- 以下 m-only 元素只在手机（触屏）上显示 -->
<div id="mEmpty" class="m-only">
  <div class="m-brand">逐句阅读器</div>
  <div class="m-hero">
    <div class="m-h1">一句一屏地读 Markdown / EPUB / TXT。</div>
    <div class="m-sub">会记住上次读的书和读到哪一句。也可以在文件管理器里选中文件，用「逐句阅读器」打开。</div>
  </div>
  <div class="m-actions">
    <button id="mEmptyOpen" class="m-btn primary"><svg class="ic"><use href="#i-folder"/></svg>打开文件</button>
    <button id="mEmptyTip" class="m-btn quiet"><svg class="ic"><use href="#i-coffee"/></svg>赞赏</button>
  </div>
</div>
<div id="mBar" class="m-only">
  <div id="mStatus"><span id="mCount"></span><span id="mAutoState"><svg class="ic"><use href="#i-play-circle"/></svg><span id="mAutoText"></span></span></div>
  <div id="mTrack"><div id="mFill"></div></div>
  <div id="mBtns">
    <button id="mMenuBtn" class="mb" aria-label="菜单"><svg class="ic"><use href="#i-list"/></svg></button>
    <span style="flex:1"></span>
    <button id="mPrev" class="mb" aria-label="上一句"><svg class="ic"><use href="#i-caret-left"/></svg></button>

<script>
// ---------- 切句 ----------
// 先按中文句末标点切，再按英文句号+空格+大写切；太短的并入上一句，太长的在分号处再切。
function splitSentences(text) {
  text = text.replace(/\s+/g, ' ').trim();
  if (!text) return [];
  const cjk = text.match(/[^。！？!?…]+(?:[。！？!?…]+[”’」』）》)"']*)?/g) || [text];
  let parts = [];
  for (const c of cjk) parts.push(...c.split(/(?<=[a-z0-9)\]"'”’][.!?]["'”’)\]]*)\s+(?=["“‘(\[]?[A-Z0-9])/));
  parts = parts.map(s => s.trim()).filter(Boolean);
  const out = [];
  for (const p of parts) {
    if (out.length && p.length < 6) out[out.length - 1] += p;
    else out.push(p);
  }
  return out.flatMap(s => s.length > 140 ? s.split(/(?<=[；;])\s*/).filter(Boolean) : [s]).flatMap(chunk);
}
// 超过 280 字的仍然一屏放不下：在逗号/冒号/破折号处切开，再拼回每段不超过约 200 字
function chunk(s) {
  if (s.length <= 280) return [s];
  const out = [];
  for (const p of s.split(/(?<=[，,:：—、])\s*/)) {
    if (out.length && out[out.length - 1].length + p.length <= 200) out[out.length - 1] += (/[,:]$/.test(out[out.length - 1]) ? ' ' : '') + p;
    else out.push(p);
  }
  return out;
}

// ---------- Markdown ----------
function stripInline(s) {
  s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, (m, a) => a ? `［图：${a}］` : '')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\[([^\]]+)\]\[[^\]]*\]/g, '$1')
    .replace(/<[^>]+>/g, '').replace(/(\*\*|__)(.+?)\1/g, '$2').replace(/(^|[^*\w])[*_]([^*_]+)[*_](?=[^*\w]|$)/g, '$1$2')
    .replace(/~~(.+?)~~/g, '$1').replace(/`([^`]+)`/g, '$1');
  return decodeEntities(s).replace(/\u00a0/g, ' ').trim();
}
// HTML 字符引用（&#xA; &amp; &ldquo; …）按标准 Markdown 还原成字符。在去掉 <标签> 之后才做，
// 还原出的 < > 只是文字；命名引用交给 textarea 解码（只解码，不会生成标签）。不认识的原样保留。
const entityBox = document.createElement('textarea');
function decodeEntities(s) {
  return s.replace(/&(#[0-9]{1,7}|#[xX][0-9a-fA-F]{1,6}|[A-Za-z][A-Za-z0-9]{1,31});/g, (m, e) => {
    if (e[0] === '#') {
      const n = /^#[xX]/.test(e) ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
      return n > 0 && n <= 0x10ffff && !(n >= 0xd800 && n <= 0xdfff) ? String.fromCodePoint(n) : m;
    }
    entityBox.innerHTML = m; return entityBox.value;
  });
}
function parseMarkdown(src) {
  const segs = [], lines = src.replace(/\r\n?/g, '\n').split('\n');
  let chap = '', buf = [], i = 0;
  const flush = () => { const t = stripInline(buf.join(' ')); buf = []; for (const s of splitSentences(t)) segs.push({ t: s, c: chap }); };
  if (lines[0] && lines[0].trim() === '---') { i = 1; while (i < lines.length && lines[i].trim() !== '---') i++; i++; }
  for (; i < lines.length; i++) {
    const line = lines[i], t = line.trim();
    const fence = t.match(/^(```|~~~)/);
    if (fence) {
      flush(); const code = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith(fence[1]); i++) code.push(lines[i]);
      for (let k = 0; k < code.length; k += 25) segs.push({ t: code.slice(k, k + 25).join('\n'), c: chap, k: 'code' });
      continue;
    }
    const h = t.match(/^(#{1,6})\s+(.*?)\s*#*$/);
    if (h) { flush(); chap = stripInline(h[2]); segs.push({ t: chap, c: chap, k: 'h', lv: h[1].length }); continue; }
    if (!t || /^([-*_]\s*){3,}$/.test(t)) { flush(); continue; }
    if (/^\|?\s*:?-{3,}/.test(t) && t.includes('-') && /^[|\s:-]+$/.test(t)) continue;
    if (t.startsWith('|')) { flush(); buf.push(t.replace(/^\||\|$/g, '').split('|').map(x => x.trim()).join('  ·  ')); flush(); continue; }
    const li = t.match(/^(?:>\s*)*(?:[-*+]|\d+[.)])\s+(.*)$/);
    if (li) { flush(); buf.push(li[1]); continue; }
    buf.push(t.replace(/^(>\s*)+/, ''));
  }
  flush();
  return segs;
}

// ---------- EPUB（用浏览器自带的解压能力读 zip，不依赖任何外部库）----------
async function readZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = buf.byteLength - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;

  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true), name = td.decode(u8.subarray(p + 46, p + 46 + nl));

  return async (name, bin) => {

    if (f.method !== 0) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());

// 依据 2026-10-10 真书实测：《诸子百家》3610 张、《国家是怎样破产的》161 张小图都是嵌在句子里的字或图标。

}
$('qInput').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(renderSearch, 200); });
$('qInput').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qTimer); renderSearch(); addRecent($('qInput').value.trim()); } });
$('qList').addEventListener('click', e => { const row = e.target.closest('.q-row'); if (row) openHit(+row.dataset.k); });
$('qRecent').addEventListener('click', e => { const b = e.target.closest('.q-recent'); if (b) { $('qInput').value = b.textContent; renderSearch(); } });
$('qClearRecent').addEventListener('click', () => { try { localStorage.setItem('recentQ', '[]'); } catch (e) {} renderSearch(); });
$('qCancel').addEventListener('click', closeSearch);
$('qPanel').addEventListener('click', e => { if (e.target.id === 'qPanel') closeSearch(); });
$('qBtn').addEventListener('click', e => { openSearch(); e.target.blur(); });
$('qNav').addEventListener('click', e => e.stopPropagation());
tap('qPrev', () => stepHit(-1));
tap('qNext', () => stepHit(1));
tap('qClose', () => endSearch());
tap('mSearchRow', openSearch);

showSpeed();
loadLast();
</script>
</body>
</html>
